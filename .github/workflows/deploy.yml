name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_LANGUAGE: ${{ vars.SITE_LANGUAGE }}
          SITE_AUTHOR_NAME: ${{ vars.SITE_AUTHOR_NAME }}
          SITE_AUTHOR_TITLE: ${{ vars.SITE_AUTHOR_TITLE }}
          SITE_AUTHOR_BIO: ${{ vars.SITE_AUTHOR_BIO }}
          SITE_AUTHOR_EMAIL: ${{ vars.SITE_AUTHOR_EMAIL }}
          SITE_AUTHOR_LOCATION: ${{ vars.SITE_AUTHOR_LOCATION }}
          SOCIAL_GITHUB: ${{ vars.SOCIAL_GITHUB }}
          SOCIAL_LINKEDIN: ${{ vars.SOCIAL_LINKEDIN }}
          SOCIAL_TWITTER: ${{ vars.SOCIAL_TWITTER }}
          SOCIAL_MASTODON: ${{ vars.SOCIAL_MASTODON }}
          SOCIAL_BLUESKY: ${{ vars.SOCIAL_BLUESKY }}
          SITE_TITLE: ${{ vars.SITE_TITLE }}
          SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}
          SITE_TITLE: ${{ vars.SITE_TITLE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment